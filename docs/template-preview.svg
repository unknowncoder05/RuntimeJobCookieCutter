<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Runtime job template preview</title>
  <desc id="desc">A scheduled runtime job with API polling, JSONL output, and CodeSwarm runtime unit metadata.</desc>
  <rect width="960" height="540" fill="#111827"/>
  <rect x="72" y="72" width="816" height="396" rx="18" fill="#f8fafc"/>
  <rect x="112" y="116" width="260" height="308" rx="10" fill="#e5e7eb"/>
  <rect x="412" y="116" width="436" height="88" rx="10" fill="#dbeafe"/>
  <rect x="412" y="232" width="436" height="88" rx="10" fill="#dcfce7"/>
  <rect x="412" y="348" width="436" height="76" rx="10" fill="#fef3c7"/>
  <text x="134" y="158" fill="#111827" font-family="Arial, sans-serif" font-size="24" font-weight="700">projectmaker.yml</text>
  <text x="134" y="202" fill="#374151" font-family="Arial, sans-serif" font-size="18">kind: scheduled_job</text>
  <text x="134" y="236" fill="#374151" font-family="Arial, sans-serif" font-size="18">interval: 60 seconds</text>
  <text x="134" y="270" fill="#374151" font-family="Arial, sans-serif" font-size="18">command: run_job.py</text>
  <text x="438" y="153" fill="#1e3a8a" font-family="Arial, sans-serif" font-size="22" font-weight="700">1. Fetch API</text>
  <text x="438" y="181" fill="#1e40af" font-family="Arial, sans-serif" font-size="17">Call a configured endpoint once per run.</text>
  <text x="438" y="269" fill="#14532d" font-family="Arial, sans-serif" font-size="22" font-weight="700">2. Save JSONL</text>
  <text x="438" y="297" fill="#166534" font-family="Arial, sans-serif" font-size="17">Append records to data/runtime_events.jsonl.</text>
  <text x="438" y="390" fill="#78350f" font-family="Arial, sans-serif" font-size="22" font-weight="700">3. Inspect Runs</text>
  <text x="438" y="416" fill="#92400e" font-family="Arial, sans-serif" font-size="17">Use RuntimeRun logs, status, and artifacts.</text>
</svg>
